blueprint:
  name: 緊急地震速報警報（P2P地震情報）
  description: >
    初回警報または予測震度が上がった続報を受けたら、指定したメディアプレーヤーで
    警告音を再生します。取消報では再生を停止できます。
    統合の「EEWテスト」ボタンでも初回警報と同じ動作を確認できます。
  domain: automation
  input:
    player:
      name: 警告音を鳴らすスピーカー
      selector:
        target:
          entity:
            domain: media_player
    alarm_file:
      name: 警告音ファイル
      description: >
        Home AssistantのMediaフォルダに eew_warning.wav を置いた場合は、
        既定値のままで使えます。
      default: media-source://media_source/local/eew_warning.wav
      selector:
        text:
    volume:
      name: 音量
      default: 0.8
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    stop_on_cancel:
      name: 取消報で再生を停止
      description: 対象にした緊急地震速報の取消報を受けた場合に停止します。
      default: true
      selector:
        boolean:

triggers:
  - trigger: event
    event_type: p2p_eew_warning
    id: warning
  - trigger: event
    event_type: p2p_eew_update
    id: update
  - trigger: event
    event_type: p2p_eew_cancel
    id: cancel

conditions: []

variables:
  stop_on_cancel_enabled: !input stop_on_cancel

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: cancel
        sequence:
          - if:
              - condition: template
                value_template: "{{ stop_on_cancel_enabled }}"
            then:
              - action: media_player.media_stop
                target: !input player
    default:
      - action: media_player.volume_set
        target: !input player
        data:
          volume_level: !input volume

      - action: media_player.play_media
        target: !input player
        data:
          media_content_id: !input alarm_file
          media_content_type: audio/wav

mode: restart
